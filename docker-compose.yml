version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: amigos_pg_db
    restart: always
    environment:
      POSTGRES_DB: amigos_pg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d amigos_pg"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amigos_pg_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/amigos_pg
      - JWT_SECRET_KEY=amigos_pg_super_secret_key_change_me_in_production_123456
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - UPLOAD_DIR=uploads
      - CORS_ORIGINS=["http://localhost", "http://localhost:80", "http://localhost:5173"]
      - ADMIN_DEFAULT_EMAIL=admin@amigospg.com
      - ADMIN_DEFAULT_PASSWORD=AdminAmigos123
      - ADMIN_DEFAULT_PHONE=9876543210
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000/api
    container_name: amigos_pg_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads_data:
